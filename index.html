<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BENBAIJIE站</title>
    <link rel="icon" href="favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app-container">
    <aside class="sidebar">
        <div class="logo-area">
            <h2>BENBAIJIE</h2>
            <br>
            <h2>Znine</h2>
        </div>
        <div class="nav-links">
            <button class="nav-item active" data-page="home">主页</button>
            <button class="nav-item" data-page="download">下载</button>
            <button class="nav-item" data-page="announcement">公告</button>
            <button class="nav-item" data-page="chat">聊天</button>
            <div class="nav-slider" id="navSlider"></div>
        </div>
    </aside>

    <main class="main-content">
        <div id="home-page" class="page-view active-page">
            <div class="card-pane home-card" style="text-align: center;">
                <button class="lang-btn" id="langBtn" type="button">EN</button>
                <div class="home-hero">
                    <h1 class="home-title">BENBAIJIE</h1>
                    <p class="home-sub" id="changingSub">欢迎来到长途旅行下载站！</p>
                </div>
                <div class="social-buttons">
                    <a href="https://b23.tv/eoXbYnf" class="social-btn" target="_blank" rel="noopener noreferrer">主播B站</a>
                    <a href="https://www.coolapk.com/u/Znine2026" class="social-btn" target="_blank" rel="noopener noreferrer">主播酷安</a>
                    <a href="https://v.douyin.com/W3Kr-T5m2cU/" class="social-btn" target="_blank" rel="noopener noreferrer">主播抖音</a>
                </div>
                <div class="stat-info site-stats">
                    <span class="stat-badge">总访问量 <b id="statTotal">-</b></span>
                    <span class="stat-badge">今日访问 <b id="statToday">-</b></span>
                    <span class="stat-badge">当前在线 <b id="statOnline">-</b></span>
                </div>
            </div>
            <div class="video-wrapper">
                <iframe src="https://player.bilibili.com/player.html?bvid=BV1Vd7j6DEhq&page=1&autoplay=1&muted=1" allow="autoplay; encrypted-media" allowfullscreen></iframe>
            </div>
        </div>

        <div id="download-page" class="page-view">
            <h2 class="page-title">软件下载</h2>
            <div class="card-pane">
                <div class="dl-admin-bar" id="dlAdminBar" style="display:none;">
                    <button type="button" class="f-btn primary" id="dlAddBtn">+ 发布软件</button>
                </div>
                <div class="download-grid" id="downloadGrid"></div>
                <div class="tip-warning">
                    提示：网盘是小飞机网盘支持不登录直链下载，并且还不限速，但是我还是建议进群下载，因为群内的消息绝对是最新的！
                </div>
            </div>
        </div>

        <div id="announcement-page" class="page-view">
            <h2 class="page-title">最新公告</h2>
            <div class="card-pane">
                <form class="ann-compose" id="annForm" style="display:none;">
                    <input type="text" id="annTitle" placeholder="公告标题" maxlength="50" required>
                    <textarea id="annContent" placeholder="公告内容..." maxlength="2000" rows="4" required></textarea>
                    <div class="compose-btns"><button type="submit" class="f-btn primary">发布公告</button></div>
                    <div class="auth-error" id="annError"></div>
                </form>
                <div class="announcement-list" id="annList"></div>
            </div>
        </div>

        <div id="chat-page" class="page-view">
            <h2 class="page-title">聊天室</h2>

            <div class="card-pane" id="authPane">
                <div class="auth-tabs">
                    <button class="auth-tab active" id="loginTab" type="button">登录</button>
                    <button class="auth-tab" id="registerTab" type="button">注册</button>
                </div>

                <form class="auth-form" id="loginForm">
                    <div class="field-row">
                        <input type="text" id="loginEmail" placeholder="邮箱" required autocomplete="username">
                        <span class="field-hint" id="loginEmailHint">邮箱格式不正确</span>
                    </div>
                    <input type="password" id="loginPassword" placeholder="密码" required autocomplete="current-password">
                    <button type="submit" class="auth-submit">登录</button>
                    <div class="auth-links"><button type="button" class="auth-link" id="forgotLink">忘记密码？</button></div>
                </form>

                <form class="auth-form" id="registerForm" style="display:none;">
                    <input type="text" id="regUsername" placeholder="用户名" maxlength="20" required>
                    <div class="field-row">
                        <input type="email" id="regEmail" placeholder="邮箱" required autocomplete="email">
                        <span class="field-hint" id="regEmailHint">邮箱格式不正确</span>
                    </div>
                    <div class="code-row" id="regCodeRow" style="display:none;">
                        <input type="text" id="regCode" placeholder="邮箱验证码" maxlength="6" inputmode="numeric">
                        <button type="button" class="code-btn" id="regCodeBtn">获取验证码</button>
                    </div>
                    <input type="password" id="regPassword" placeholder="密码（至少6位）" minlength="6" required autocomplete="new-password">
                    <button type="submit" class="auth-submit">注册并登录</button>
                </form>

                <form class="auth-form" id="resetForm" style="display:none;">
                    <div class="field-row">
                        <input type="email" id="resetEmail" placeholder="注册时用的邮箱" required autocomplete="email">
                        <span class="field-hint" id="resetEmailHint">邮箱格式不正确</span>
                    </div>
                    <div class="code-row">
                        <input type="text" id="resetCode" placeholder="邮箱验证码" maxlength="6" inputmode="numeric" required>
                        <button type="button" class="code-btn" id="resetCodeBtn">获取验证码</button>
                    </div>
                    <input type="password" id="resetPassword" placeholder="新密码（至少6位）" minlength="6" required autocomplete="new-password">
                    <button type="submit" class="auth-submit">重置密码</button>
                    <div class="auth-links"><button type="button" class="auth-link" id="backToLogin">返回登录</button></div>
                </form>

                <div class="auth-error" id="authError"></div>
            </div>

            <div class="card-pane chat-pane" id="chatPane" style="display:none;">
                <div class="chat-header">
                    <div class="chat-header-btns">
                        <button class="chat-logout" id="changePwdBtn" type="button">账号管理</button>
                        <button class="chat-logout" id="logoutBtn" type="button">退出登录</button>
                    </div>
                </div>
                <form class="auth-form change-pwd-form" id="changePwdForm" style="display:none;">
                    <div class="account-info" id="accountInfo"></div>
                    <div class="avatar-row">
                        <span class="avatar avatar-lg avatar-letter" id="myAvatar">?</span>
                        <div class="avatar-side">
                            <label class="code-btn avatar-upload-btn" for="avatarInput">上传头像</label>
                            <input type="file" id="avatarInput" accept="image/png,image/jpeg,image/gif,image/webp" style="display:none;">
                            <div class="account-stats" id="accountStats"></div>
                        </div>
                    </div>
                    <div class="auth-error" id="avatarMsg"></div>
                    <input type="password" id="oldPwd" placeholder="当前密码" required autocomplete="current-password">
                    <input type="password" id="newPwd" placeholder="新密码（至少6位）" minlength="6" required autocomplete="new-password">
                    <button type="submit" class="auth-submit">确认修改</button>
                    <div class="auth-error" id="pwdError"></div>
                </form>
                <div class="chat-subtabs">
                    <button class="auth-tab active" id="tabChat" type="button">聊天室</button>
                    <button class="auth-tab" id="tabForum" type="button">论坛</button>
                </div>
                <div id="chatView">
                    <div class="chat-messages" id="chatMessages"></div>
                    <form class="chat-input-row" id="chatForm">
                        <input type="text" id="chatInput" placeholder="说点什么..." maxlength="500" autocomplete="off">
                        <button type="submit" class="chat-send">发送</button>
                    </form>
                </div>
                <div id="forumView" style="display:none;">
                    <div class="forum-toolbar">
                        <input type="text" id="forumSearch" placeholder="搜索帖子标题、内容或作者..." maxlength="50" autocomplete="off">
                        <button class="f-btn" id="newPostBtn" type="button">＋ 发帖</button>
                    </div>
                    <form class="forum-compose" id="postForm" style="display:none;">
                        <input type="text" id="postTitle" placeholder="帖子标题" maxlength="50" required>
                        <input type="text" id="postTags" placeholder="标签（用逗号分隔，最多5个）" maxlength="60">
                        <textarea id="postContent" placeholder="分享点什么..." maxlength="2000" rows="3" required></textarea>
                        <div class="compose-btns">
                            <button type="button" class="f-btn" id="cancelPostBtn">取消</button>
                            <button type="submit" class="f-btn primary">发布</button>
                        </div>
                    </form>
                    <div class="forum-list" id="forumList"></div>
                    <div class="post-detail" id="postDetail" style="display:none;"></div>
                </div>
            </div>
        </div>

        <div id="about-page" class="page-view">
            <h2 class="page-title">关于我们</h2>
            <div class="stat-badge">网站开放时间: 2026.04.14</div>
            <a href="https://qm.qq.com/q/5iUnJBtBWU" target="_blank" class="group-btn">进入官方QQ群 (点击跳转)</a>
        </div>
    </main>
</div>

<div class="dl-mask" id="dlModal" style="display:none;">
    <div class="dl-modal">
        <h3 id="dlModalTitle">发布软件</h3>
        <div class="dl-form">
            <label class="dl-field">软件名称
                <input type="text" id="swName" maxlength="50" placeholder="软件名称">
            </label>
            <label class="dl-field">简介
                <textarea id="swDesc" maxlength="500" rows="3" placeholder="软件简介..."></textarea>
            </label>
            <div class="dl-row">
                <label class="dl-field">版本
                    <input type="text" id="swVersion" maxlength="30" placeholder="如 V1.0">
                </label>
                <label class="dl-field">日期
                    <input type="text" id="swDate" maxlength="20" placeholder="如 2026-10-10">
                </label>
            </div>
            <div class="dl-row">
                <label class="dl-field">大小
                    <input type="text" id="swSize" maxlength="30" placeholder="如 3.75 MB">
                </label>
                <label class="dl-field">作者
                    <input type="text" id="swAuthor" maxlength="30" placeholder="作者">
                </label>
            </div>
            <label class="dl-field">下载链接
                <input type="text" id="swUrl" maxlength="500" placeholder="网盘链接或本地文件名">
            </label>
            <label class="dl-field">封面图片 <span class="dl-img-hint">png/jpg/gif/webp，最大5MB，可留空</span>
                <input type="file" id="swImage" accept="image/png,image/jpeg,image/gif,image/webp">
                <div class="dl-img-preview" id="swImgPreview" style="display:none;">
                    <img id="swImgThumb" alt="预览">
                    <button type="button" class="f-btn dl-img-clear" id="swImgClear">移除图片</button>
                </div>
            </label>
            <div class="auth-error" id="swError"></div>
            <div class="compose-btns dl-modal-btns">
                <button type="button" class="f-btn primary" id="swSaveBtn">发布</button>
                <button type="button" class="f-btn" id="swCancelBtn">取消</button>
            </div>
        </div>
    </div>
</div>

<script src="script.js"></script>
</body>
</html>
